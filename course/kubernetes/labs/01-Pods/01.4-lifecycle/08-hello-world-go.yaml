apiVersion: v1
kind: Pod
metadata:
  name: hello-world-probes
  labels:
    app: hello-world-probes
spec:
  containers:
    - name: hello-world
      image: hello-world-go:probes
      imagePullPolicy: Never
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world-probes
spec:
  selector:
    app: hello-world-probes
  ports:
    - port: 8080
      targetPort: 8080
