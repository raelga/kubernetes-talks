apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: routing-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: routing-demo
      version: blue
  template:
    metadata:
      labels:
        app: routing-demo
        version: blue
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["sh", "-c"]
          args: ['mkdir -p /www; echo "blue: $(hostname)" > /www/index.html; exec httpd -f -p 8080 -h /www']
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: routing-green
spec:
  replicas: 0
  selector:
    matchLabels:
      app: routing-demo
      version: green
  template:
    metadata:
      labels:
        app: routing-demo
        version: green
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["sh", "-c"]
          args: ['mkdir -p /www; echo "green: $(hostname)" > /www/index.html; exec httpd -f -p 8080 -h /www']
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: routing-demo
spec:
  selector:
    app: routing-demo
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: routing-client
spec:
  containers:
    - name: client
      image: raelga/toolbox
      command: ["/bin/bash", "-c"]
      args:
        - 'while true; do curl -sS --max-time 3 http://routing-demo:8080/; sleep 1; done'
