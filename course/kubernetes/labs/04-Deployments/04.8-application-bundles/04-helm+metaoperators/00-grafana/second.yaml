---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  labels:
    dashboards: "grafana"
  name: second
  namespace: monitoring
spec:
  config:
    log:
      mode: "console"
    auth:
      disable_login_form: "false"
    security:
      admin_user: admin
      admin_password: admin
  service:
    spec:
      type: ClusterIP
      ports:
        - name: grafana-http
          port: 80
          protocol: TCP
          targetPort: grafana-http
---
