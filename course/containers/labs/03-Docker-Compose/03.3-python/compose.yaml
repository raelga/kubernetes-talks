services:
  frontend:
    build: .
    command: python frontend.py
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend
  backend:
    build: .
    command: python backend.py
    volumes:
      - datos:/data

volumes:
  datos:
