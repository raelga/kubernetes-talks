<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="A Cloudflare Worker executes JavaScript near users, selects a regional Kubernetes application geographically, and connects shared state through Cloudflare D1">
