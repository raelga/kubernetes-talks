    <path d="M 565 270 H 590 V 330 H 620" marker-end="url(#arrow)"/>
    <path d="M 450 290 V 338" marker-end="url(#arrow)"/>
    <rect x="355" y="348" width="190" height="60" rx="12"/>
  </g>
