<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="Target architecture: schematic globe with Cloudflare global edge routing to four regional Kubernetes applications: AWS EKS Oceania ap-southeast-2 Sydney; Azure AKS Europe westeurope; GCP GKE Asia asia-northeast1-a; DigitalOcean DOKS North America nyc1 New York. One external Cloudflare D1 provides shared state. Positions are schematic, not geographic coordinates; no live deployment is implied.">
