apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook
spec:
  template:
    spec:
      containers:
      - name: guestbook
        envFrom:
        - configMapRef:
            name: guestbook-shared-location
        env:
        - name: STATE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: guestbook-shared-state
              key: STATE_API_TOKEN
