apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
patches:
- path: deployment.yml
  target:
    kind: Deployment
    name: guestbook
configMapGenerator:
- name: guestbook-shared-location
  literals:
  - APP_MODE=shared
  - STATE_API_URL=https://guestbook.rael.dev
generatorOptions:
  labels:
    app.kubernetes.io/part-of: cloud-guestbook
    app.kubernetes.io/component: shared
secretGenerator:
- name: guestbook-shared-state
  envs:
  - credentials.env
