apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
- redis.yml
patches:
- path: deployment.yml
  target:
    kind: Deployment
    name: guestbook
configMapGenerator:
- name: guestbook-local-location
  literals:
  - APP_MODE=local
  - REDIS_ADDRESS=guestbook-local-redis:6379
generatorOptions:
  labels:
    app.kubernetes.io/part-of: cloud-guestbook
    app.kubernetes.io/component: local
